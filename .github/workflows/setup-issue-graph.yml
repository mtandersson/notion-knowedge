name: One-off setup native issue hierarchy and dependencies

on:
  push:
    paths:
      - .github/workflows/setup-issue-graph.yml

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure native sub-issues and dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "notion-knowledge-issue-graph-setup",
          }

          def api(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  detail = e.read().decode(errors="replace")
                  raise RuntimeError(f"{method} {path} -> {e.code}: {detail}") from e

          issue_cache = {}
          def issue(number):
              if number not in issue_cache:
                  issue_cache[number] = api("GET", f"/issues/{number}")
              return issue_cache[number]

          # Native hierarchy: End Goal -> epics -> implementation tickets.
          children = {
              1: list(range(2, 14)),
              2: list(range(14, 21)),
              3: list(range(21, 28)),
              4: [28, 29, 30, 31, 32, 33, 35],
              5: list(range(36, 44)),
              6: list(range(44, 52)),
              7: list(range(52, 60)),
              8: list(range(60, 66)),
              9: list(range(66, 76)),
              10: list(range(76, 84)),
              11: list(range(84, 94)),
              12: list(range(94, 104)),
              13: list(range(104, 116)),
          }

          # Native blocked-by graph. Parent/epic issues are blocked by every direct sub-issue.
          blocked_by = {parent: list(kids) for parent, kids in children.items()}

          # Leaf prerequisites: only relationships where the target cannot be completed correctly
          # before the blocker provides a required contract, implementation, or artifact.
          leaf = {
              15: [14],
              16: [15],
              17: [15],
              18: [15, 16],
              19: [15, 16],
              20: [15],

              21: [15],
              22: [16, 21],
              23: [21, 22],
              24: [21, 22],
              25: [24],
              26: [25],
              27: [21, 22],

              28: [14],
              29: [24],
              30: [24, 28],
              31: [25, 28],
              32: [28, 31],
              33: [25, 28],
              35: [29],

              36: [15],
              37: [28],
              38: [28],
              39: [38],
              40: [37, 39],
              41: [37],
              42: [32, 37, 38],
              43: [37, 38],

              44: [15],
              45: [39, 40, 44],
              46: [41, 44],
              47: [45, 46],
              48: [30, 47],
              49: [44, 47],
              50: [31, 37, 44],
              51: [24, 49],

              52: [18],
              53: [36, 52],
              54: [53],
              55: [29, 42, 54],
              56: [29, 42, 54],
              57: [53],
              58: [29, 36, 42],
              59: [36, 53, 58],

              60: [28, 36],
              61: [30, 33, 60],
              62: [33, 60],
              63: [44, 60],
              64: [30, 60],
              65: [47, 61, 62],

              66: [18],
              67: [66],
              68: [67],
              69: [22, 23, 68],
              70: [69],
              71: [27, 69],
              72: [27, 69],
              73: [71, 72],
              74: [24, 71, 72],
              75: [74],

              76: [21],
              77: [27, 76, 87],
              78: [27, 76, 87],
              79: [25, 26, 76, 87],
              80: [24, 76],
              81: [36, 76],
              82: [76],
              83: [42, 77, 78, 79],

              84: [18],
              85: [66, 76],
              86: [66, 76],
              87: [21, 29],
              88: [67],
              89: [16],
              90: [76, 89],
              91: [14],
              92: [20],
              93: [18, 66],

              95: [45, 46, 47, 94],
              96: [95],
              97: [94],
              98: [39, 95, 96],
              99: [95, 96, 98],
              100: [46, 94, 95, 96],
              101: [51, 94, 95, 96],
              102: [65, 94, 95, 96],
              103: [95, 96, 100],

              104: [15, 16],
              105: [104],
              106: [19, 89],
              107: [23, 44, 53],
              108: [19],
              109: [18, 84],
              110: [42, 47, 74, 83, 87],
              111: [36, 37, 58],
              112: [53, 104],
              113: [20, 43],
              114: [51, 74, 83, 109],
              115: [94, 114],
          }
          for n, deps in leaf.items():
              blocked_by.setdefault(n, [])
              blocked_by[n].extend(deps)

          # Deduplicate while preserving order.
          blocked_by = {n: list(dict.fromkeys(deps)) for n, deps in blocked_by.items()}

          print("Setting native sub-issue hierarchy...")
          for parent, kids in children.items():
              existing = api("GET", f"/issues/{parent}/sub_issues?per_page=100") or []
              existing_numbers = {x["number"] for x in existing}
              for child in kids:
                  if child in existing_numbers:
                      continue
                  api("POST", f"/issues/{parent}/sub_issues", {"sub_issue_id": issue(child)["id"]})
                  print(f"  added sub-issue #{child} -> parent #{parent}")
                  time.sleep(0.2)

          print("Setting native blocked-by dependencies...")
          for target, blockers in blocked_by.items():
              existing = api("GET", f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
              existing_numbers = {x["number"] for x in existing}
              for blocker in blockers:
                  if blocker in existing_numbers:
                      continue
                  api("POST", f"/issues/{target}/dependencies/blocked_by", {"issue_id": issue(blocker)["id"]})
                  print(f"  #{target} blocked by #{blocker}")
                  time.sleep(0.2)

          print("Verifying hierarchy and dependency graph...")
          errors = []
          for parent, kids in children.items():
              actual = api("GET", f"/issues/{parent}/sub_issues?per_page=100") or []
              actual_nums = {x["number"] for x in actual}
              missing = set(kids) - actual_nums
              if missing:
                  errors.append(f"parent #{parent} missing sub-issues {sorted(missing)}")

          for target, blockers in blocked_by.items():
              actual = api("GET", f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
              actual_nums = {x["number"] for x in actual}
              missing = set(blockers) - actual_nums
              if missing:
                  errors.append(f"#{target} missing blockers {sorted(missing)}")

          if errors:
              raise SystemExit("\n".join(errors))

          print(f"Verified {sum(len(v) for v in children.values())} parent/sub-issue relations.")
          print(f"Verified {sum(len(v) for v in blocked_by.values())} blocked-by relations.")
          PY

# trigger existing workflow on default branch
