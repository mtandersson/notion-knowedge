name: One-off setup native issue graph and labels

on:
  pull_request:
    paths:
      - .github/issue-graph-trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: one-off-native-issue-graph
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure native hierarchy, dependencies, labels and titles
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
              "User-Agent": "notion-knowledge-issue-graph-setup",
          }

          def api(method, path, data=None, tolerate=()):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  detail = e.read().decode(errors="replace")
                  if e.code in tolerate:
                      return {"_http_error": e.code, "_detail": detail}
                  raise RuntimeError(f"{method} {path} -> {e.code}: {detail}") from e

          issue_cache = {}
          def issue(number, refresh=False):
              if refresh or number not in issue_cache:
                  issue_cache[number] = api("GET", f"/issues/{number}")
              return issue_cache[number]

          children = {
              1: list(range(2, 14)),
              2: list(range(14, 21)),
              3: list(range(21, 28)),
              4: [28, 29, 30, 31, 32, 33, 35],
              5: list(range(36, 44)),
              6: list(range(44, 52)),
              7: list(range(52, 60)),
              8: list(range(60, 66)),
              9: list(range(66, 76)),
              10: list(range(76, 84)),
              11: list(range(84, 94)),
              12: list(range(94, 104)),
              13: list(range(104, 116)),
          }

          # Parent issues are blocked by every direct sub-issue. This makes GitHub's
          # native completion/dependency UI reflect the hierarchy recursively.
          blocked_by = {parent: list(kids) for parent, kids in children.items()}

          # Leaf prerequisites: only true implementation prerequisites.
          leaf = {
              15: [14],
              16: [15],
              17: [15],
              18: [15, 16],
              19: [15, 16],
              20: [15],

              21: [15],
              22: [16, 21],
              23: [21, 22],
              24: [21, 22],
              25: [24],
              26: [25],
              27: [21, 22],

              28: [14],
              29: [24],
              30: [24, 28],
              31: [25, 28],
              32: [28, 31],
              33: [25, 28],
              35: [29],

              36: [15],
              37: [28],
              38: [28],
              39: [38],
              40: [37, 39],
              41: [37],
              42: [32, 37, 38],
              43: [37, 38],

              44: [15],
              45: [39, 40, 44],
              46: [41, 44],
              47: [45, 46],
              48: [30, 47],
              49: [44, 47],
              50: [31, 37, 44],
              51: [24, 49],

              52: [18],
              53: [36, 52],
              54: [53],
              55: [29, 42, 54],
              56: [29, 42, 54],
              57: [53],
              58: [29, 36, 42],
              59: [36, 53, 58],

              60: [28, 36],
              61: [30, 33, 60],
              62: [33, 60],
              63: [44, 60],
              64: [30, 60],
              65: [47, 61, 62],

              66: [18],
              67: [66],
              68: [67],
              69: [22, 23, 68],
              70: [69],
              71: [27, 69],
              72: [27, 69],
              73: [71, 72],
              74: [24, 71, 72],
              75: [74],

              76: [21],
              77: [27, 76, 87],
              78: [27, 76, 87],
              79: [25, 26, 76, 87],
              80: [24, 76],
              81: [36, 76],
              82: [76],
              83: [42, 77, 78, 79],

              84: [18],
              85: [66, 76],
              86: [66, 76],
              87: [21, 29],
              88: [67],
              89: [16],
              90: [76, 89],
              91: [14],
              92: [20],
              93: [18, 66],

              95: [45, 46, 47, 94],
              96: [95],
              97: [94],
              98: [39, 95, 96],
              99: [95, 96, 98],
              100: [46, 94, 95, 96],
              101: [51, 94, 95, 96],
              102: [65, 94, 95, 96],
              103: [95, 96, 100],

              104: [15, 16],
              105: [104],
              106: [19, 89],
              107: [23, 44, 53],
              108: [19],
              109: [18, 84],
              110: [42, 47, 74, 83, 87],
              111: [36, 37, 58],
              112: [53, 104],
              113: [20, 43],
              114: [51, 74, 83, 109],
              115: [94, 114],
          }
          for n, deps in leaf.items():
              blocked_by.setdefault(n, []).extend(deps)
          blocked_by = {n: list(dict.fromkeys(v)) for n, v in blocked_by.items()}

          labels = {
              "type:end-goal": ("5319e7", "Top-level project outcome"),
              "type:epic": ("8250df", "Epic grouping native sub-issues"),
              "type:task": ("d4c5f9", "Implementation task"),
              "area:foundation": ("c2e0c6", "Project foundation and MCP shell"),
              "area:notion": ("f9d0c4", "Notion API/backend integration"),
              "area:indexing": ("bfdadc", "Canonical documents, chunking, local index and embeddings"),
              "area:search": ("fbca04", "Retrieval, ranking and knowledge search"),
              "area:sync": ("0e8a16", "Webhooks, reconciliation and freshness"),
              "area:graph": ("1d76db", "Knowledge graph and relations"),
              "area:files": ("0052cc", "ChatGPT file/image ingestion and Notion uploads"),
              "area:writes": ("b60205", "Safe Notion mutation workflows"),
              "area:security": ("d73a4a", "Security, privacy and access control"),
              "area:evaluation": ("7057ff", "Search quality evaluation and regression"),
              "area:operations": ("006b75", "Deployment, observability and operations"),
              "integration:chatgpt": ("2188ff", "ChatGPT custom MCP integration"),
              "status:duplicate": ("cfd3d7", "Duplicate issue retained for history"),
              "phase:0": ("ededed", "Phase 0 - server skeleton"),
              "phase:1": ("ededed", "Phase 1 - authoritative Notion read path"),
              "phase:2": ("ededed", "Phase 2 - local retrieval MVP"),
              "phase:3": ("ededed", "Phase 3 - freshness and sync"),
              "phase:4": ("ededed", "Phase 4 - direct ChatGPT files/images"),
              "phase:5": ("ededed", "Phase 5 - graph and safe writes"),
              "phase:6": ("ededed", "Phase 6 - quality evaluation"),
              "phase:7": ("ededed", "Phase 7 - production and cutover"),
          }

          parent_meta = {
              2: ("area:foundation", "phase:0"),
              3: ("area:notion", "phase:1"),
              4: ("area:indexing", "phase:1"),
              5: ("area:indexing", "phase:2"),
              6: ("area:search", "phase:2"),
              7: ("area:sync", "phase:3"),
              8: ("area:graph", "phase:5"),
              9: ("area:files", "phase:4"),
              10: ("area:writes", "phase:5"),
              11: ("area:security", "phase:5"),
              12: ("area:evaluation", "phase:6"),
              13: ("area:operations", "phase:7"),
          }

          issue_labels = {1: ["type:end-goal", "integration:chatgpt"]}
          for parent, kids in children.items():
              if parent == 1:
                  continue
              area, phase = parent_meta[parent]
              issue_labels[parent] = ["type:epic", area, phase]
              for child in kids:
                  issue_labels[child] = ["type:task", area, phase]
          issue_labels[34] = ["type:task", "area:indexing", "phase:1", "status:duplicate"]
          for n in list(range(66, 76)) + [109, 114, 115]:
              issue_labels.setdefault(n, []).append("integration:chatgpt")
          for n in [67, 68, 75]:
              issue_labels.setdefault(n, []).append("area:security")

          print("Creating labels...")
          current_labels = api("GET", "/labels?per_page=100") or []
          existing_label_names = {x["name"] for x in current_labels}
          for name, (color, description) in labels.items():
              if name not in existing_label_names:
                  api("POST", "/labels", {"name": name, "color": color, "description": description})
                  existing_label_names.add(name)
                  print(f"  created {name}")

          print("Cleaning issue title prefixes and assigning labels...")
          for n in range(1, 116):
              it = issue(n)
              title = it["title"]
              clean = title
              for prefix in ("[END GOAL] ", "[EPIC] ", "[TASK] "):
                  if clean.startswith(prefix):
                      clean = clean[len(prefix):]
              if clean != title:
                  api("PATCH", f"/issues/{n}", {"title": clean})
                  issue_cache.pop(n, None)
                  print(f"  #{n} title -> {clean}")
              wanted = list(dict.fromkeys(issue_labels.get(n, [])))
              if wanted:
                  api("POST", f"/issues/{n}/labels", {"labels": wanted})

          print("Verifying/repairing native sub-issue hierarchy...")
          for parent, kids in children.items():
              existing = api("GET", f"/issues/{parent}/sub_issues?per_page=100") or []
              existing_numbers = {x["number"] for x in existing}
              for child in kids:
                  if child in existing_numbers:
                      continue
                  result = api(
                      "POST",
                      f"/issues/{parent}/sub_issues",
                      {"sub_issue_id": issue(child, refresh=True)["id"]},
                      tolerate=(422,),
                  )
                  if result and result.get("_http_error"):
                      refreshed = api("GET", f"/issues/{parent}/sub_issues?per_page=100") or []
                      if child not in {x["number"] for x in refreshed}:
                          raise RuntimeError(
                              f"Failed to attach #{child} to parent #{parent}: {result['_detail']}"
                          )
                  print(f"  added sub-issue #{child} -> parent #{parent}")
                  existing_numbers.add(child)
                  time.sleep(0.25)

          print("Setting native blocked-by dependencies...")
          for target, blockers in blocked_by.items():
              existing = api("GET", f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
              existing_numbers = {x["number"] for x in existing}
              for blocker in blockers:
                  if blocker in existing_numbers:
                      continue
                  result = api(
                      "POST",
                      f"/issues/{target}/dependencies/blocked_by",
                      {"issue_id": issue(blocker, refresh=True)["id"]},
                      tolerate=(422,),
                  )
                  if result and result.get("_http_error"):
                      refreshed = api("GET", f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
                      if blocker not in {x["number"] for x in refreshed}:
                          raise RuntimeError(
                              f"Failed to add #{target} blocked by #{blocker}: {result['_detail']}"
                          )
                  print(f"  #{target} blocked by #{blocker}")
                  existing_numbers.add(blocker)
                  time.sleep(0.35)

          print("Verifying final graph, titles and labels...")
          errors = []
          for parent, kids in children.items():
              actual = api("GET", f"/issues/{parent}/sub_issues?per_page=100") or []
              actual_nums = {x["number"] for x in actual}
              missing = set(kids) - actual_nums
              if missing:
                  errors.append(f"parent #{parent} missing sub-issues {sorted(missing)}")

          for target, blockers in blocked_by.items():
              actual = api("GET", f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
              actual_nums = {x["number"] for x in actual}
              missing = set(blockers) - actual_nums
              if missing:
                  errors.append(f"#{target} missing blockers {sorted(missing)}")

          for n, wanted in issue_labels.items():
              it = api("GET", f"/issues/{n}")
              actual_labels = {x["name"] for x in it.get("labels", [])}
              missing = set(wanted) - actual_labels
              if missing:
                  errors.append(f"#{n} missing labels {sorted(missing)}")
              if it["title"].startswith(("[END GOAL] ", "[EPIC] ", "[TASK] ")):
                  errors.append(f"#{n} still has title prefix")

          if errors:
              raise SystemExit("\n".join(errors))

          print(f"Verified {sum(len(v) for v in children.values())} native parent/sub-issue relations.")
          print(f"Verified {sum(len(v) for v in blocked_by.values())} native blocked-by relations.")
          print("Verified title cleanup and labels.")
          PY
