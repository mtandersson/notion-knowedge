name: One-off wire OAuth issue graph

on:
  pull_request:
    paths:
      - .github/oauth-graph-trigger

permissions:
  contents: read
  issues: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Wire OAuth epic, dependencies, labels and ordering
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          base=f"https://api.github.com/repos/{repo}"
          headers={
            "Accept":"application/vnd.github+json",
            "Authorization":f"Bearer {token}",
            "X-GitHub-Api-Version":"2026-03-10",
            "User-Agent":"notion-knowledge-oauth-graph",
          }

          def api(method,path,data=None,tolerate=()):
            body=None if data is None else json.dumps(data).encode()
            req=urllib.request.Request(base+path,data=body,method=method,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read()
                return json.loads(raw) if raw else None
            except urllib.error.HTTPError as e:
              detail=e.read().decode(errors="replace")
              if e.code in tolerate:
                return {"_http_error":e.code,"_detail":detail}
              raise RuntimeError(f"{method} {path} -> {e.code}: {detail}") from e

          cache={}
          def issue(n):
            if n not in cache:
              cache[n]=api("GET",f"/issues/{n}")
            return cache[n]

          def ensure_label(name,color,description):
            r=api("POST","/labels",{"name":name,"color":color,"description":description},tolerate=(422,))
            if r and r.get("_http_error"):
              pass

          def add_labels(n,names):
            api("POST",f"/issues/{n}/labels",{"labels":names})

          def ensure_sub(parent,child):
            current=api("GET",f"/issues/{parent}/sub_issues?per_page=100") or []
            if child in {x["number"] for x in current}:
              return
            r=api("POST",f"/issues/{parent}/sub_issues",{"sub_issue_id":issue(child)["id"]},tolerate=(422,))
            current=api("GET",f"/issues/{parent}/sub_issues?per_page=100") or []
            if child not in {x["number"] for x in current}:
              raise RuntimeError(f"could not attach #{child} under #{parent}: {r}")

          def ensure_blocked_by(target,blocker):
            current=api("GET",f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
            if blocker in {x["number"] for x in current}:
              return
            r=api("POST",f"/issues/{target}/dependencies/blocked_by",{"issue_id":issue(blocker)["id"]},tolerate=(422,))
            current=api("GET",f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
            if blocker not in {x["number"] for x in current}:
              raise RuntimeError(f"could not add #{target} blocked by #{blocker}: {r}")

          def remove_blocked_by(target,blocker):
            current=api("GET",f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
            if blocker not in {x["number"] for x in current}:
              return
            api("DELETE",f"/issues/{target}/dependencies/blocked_by/{issue(blocker)['id']}")
            current=api("GET",f"/issues/{target}/dependencies/blocked_by?per_page=100") or []
            if blocker in {x["number"] for x in current}:
              raise RuntimeError(f"could not remove #{target} blocked by #{blocker}")

          ensure_label("area:auth","8b5cf6","OAuth, identity and authentication")
          for n in range(117,131):
            add_labels(n,["area:auth"])

          # Native hierarchy.
          ensure_sub(1,117)
          for n in range(118,131):
            ensure_sub(117,n)

          # Parent issues blocked by all direct children.
          ensure_blocked_by(1,117)
          for n in range(118,131):
            ensure_blocked_by(117,n)

          # OAuth implementation DAG.
          deps={
            118:[91],
            119:[18,118],
            120:[119],
            121:[118],
            122:[121],
            123:[122],
            124:[123],
            125:[122],
            126:[122],
            127:[120,125,126],
            128:[124,127],
            129:[128],
            130:[129],
            109:[18,129,130],
          }
          for target,blockers in deps.items():
            for blocker in blockers:
              ensure_blocked_by(target,blocker)

          # #84 is now development/fallback bearer auth and must not block
          # the production ChatGPT OAuth connection ticket.
          remove_blocked_by(109,84)

          # Native top-level epic ordering follows implementation roadmap.
          desired_top=[2,3,4,5,6,7,9,8,11,117,10,12,13]
          for prev,cur in zip(desired_top,desired_top[1:]):
            api("PATCH","/issues/1/sub_issues/priority",{
              "sub_issue_id":issue(cur)["id"],
              "after_id":issue(prev)["id"],
            })

          # OAuth child order.
          desired_oauth=list(range(118,131))
          for prev,cur in zip(desired_oauth,desired_oauth[1:]):
            api("PATCH","/issues/117/sub_issues/priority",{
              "sub_issue_id":issue(cur)["id"],
              "after_id":issue(prev)["id"],
            })

          # Verify.
          errors=[]
          top=[x["number"] for x in api("GET","/issues/1/sub_issues?per_page=100")]
          if top!=desired_top:
            errors.append(f"top order {top} != {desired_top}")
          oauth=[x["number"] for x in api("GET","/issues/117/sub_issues?per_page=100")]
          if oauth!=desired_oauth:
            errors.append(f"oauth order {oauth} != {desired_oauth}")

          expected={1:[117],117:desired_oauth,**deps}
          for target,blockers in expected.items():
            actual={x["number"] for x in (api("GET",f"/issues/{target}/dependencies/blocked_by?per_page=100") or [])}
            missing=set(blockers)-actual
            if missing:
              errors.append(f"#{target} missing blockers {sorted(missing)}")
          actual109={x["number"] for x in (api("GET","/issues/109/dependencies/blocked_by?per_page=100") or [])}
          if 84 in actual109:
            errors.append("#109 still blocked by #84")

          for n in range(117,131):
            it=api("GET",f"/issues/{n}")
            names={x["name"] for x in it.get("labels",[])}
            if "area:auth" not in names:
              errors.append(f"#{n} missing area:auth")

          if errors:
            raise SystemExit("\n".join(errors))

          print("OAuth graph verified.")
          print(f"#1 order: {top}")
          print(f"#117 children: {oauth}")
          print(f"#109 blockers: {sorted(actual109)}")
          PY
