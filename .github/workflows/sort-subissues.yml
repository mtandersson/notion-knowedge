name: One-off sort native sub-issues

on:
  pull_request:
    paths:
      - .github/issue-graph-trigger

permissions:
  contents: read
  issues: write

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - name: Sort native sub-issues by implementation order
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo=os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          base=f"https://api.github.com/repos/{repo}"
          headers={
            "Accept":"application/vnd.github+json",
            "Authorization":f"Bearer {token}",
            "X-GitHub-Api-Version":"2026-03-10",
            "User-Agent":"notion-knowledge-subissue-sort",
          }
          def api(method,path,data=None):
            body=None if data is None else json.dumps(data).encode()
            req=urllib.request.Request(base+path,data=body,method=method,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read()
              return json.loads(raw) if raw else None

          desired={
            1:[2,3,4,5,6,7,9,8,11,10,12,13],
            2:[14,15,16,17,18,19,20],
            3:[21,22,23,24,25,26,27],
            4:[28,29,30,31,32,33,35],
            5:[36,37,38,39,40,41,42,43],
            6:[44,45,46,47,48,49,50,51],
            7:[52,53,54,55,56,57,58,59],
            8:[60,61,62,63,64,65],
            9:[66,67,68,69,70,71,72,73,74,75],
            10:[76,77,78,79,80,81,82,83],
            11:[91,84,85,86,87,88,89,90,92,93],
            12:[94,95,96,97,98,99,100,101,102,103],
            13:[104,105,106,107,108,109,110,111,112,113,114,115],
          }
          ids={}
          def iid(n):
            if n not in ids:
              ids[n]=api("GET",f"/issues/{n}")["id"]
            return ids[n]

          for parent,want in desired.items():
            current=[x["number"] for x in api("GET",f"/issues/{parent}/sub_issues?per_page=100")]
            if current==want:
              print(f"#{parent}: already ordered")
              continue
            for prev,cur in zip(want,want[1:]):
              api("PATCH",f"/issues/{parent}/sub_issues/priority",{
                "sub_issue_id":iid(cur),
                "after_id":iid(prev),
              })
            final=[x["number"] for x in api("GET",f"/issues/{parent}/sub_issues?per_page=100")]
            if final!=want:
              raise SystemExit(f"#{parent} order mismatch: {final} != {want}")
            print(f"#{parent}: {','.join(map(str,final))}")
          PY
