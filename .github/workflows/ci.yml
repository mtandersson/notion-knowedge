name: CI
'on':
  pull_request:
    branches:
    - main
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  BENCH_CACHE_NAMESPACE: bench175-shared-v2
jobs:
  changes:
    name: CI input selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent-layout: ${{ steps.select.outputs.agent-layout }}
      fmt: ${{ steps.select.outputs.fmt }}
      clippy: ${{ steps.select.outputs.clippy }}
      check: ${{ steps.select.outputs.check }}
      test: ${{ steps.select.outputs.test }}
      build: ${{ steps.select.outputs.build }}
      container: ${{ steps.select.outputs.container }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      secrets: ${{ steps.select.outputs.secrets }}
    steps:
    - name: Checkout complete history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Test input selection and final gate
      run: python3 scripts/test-ci-jobs.py
    - name: Select relevant jobs
      id: select
      env:
        CI_EVENT: ${{ github.event_name }}
        CI_BASE: ${{ github.event.pull_request.base.sha }}
        CI_HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 scripts/ci-jobs.py select --event "$CI_EVENT" --base "$CI_BASE"
        --head "$CI_HEAD"
  agent-layout:
    needs: changes
    if: needs.changes.outputs.agent-layout == 'true'
    name: Agent layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify shared agent guidance and skill discovery
      run: ./scripts/check-agent-layout.sh
  fmt:
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#format --command true
    - name: Check formatting
      run: nix develop .#format --command cargo fmt --all -- --check
  clippy:
    name: Clippy
    needs:
    - changes
    - dev-shared
    if: always() && needs.changes.outputs.clippy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require canonical command success
      env:
        OUTCOME: ${{ needs.dev-shared.outputs.clippy }}
        SHARED_RESULT: ${{ needs.dev-shared.result }}
      run: test "$OUTCOME" = success && test "$SHARED_RESULT" = success
  check:
    name: Type check
    needs:
    - changes
    - dev-shared
    if: always() && needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require canonical command success
      env:
        OUTCOME: ${{ needs.dev-shared.outputs.check }}
        SHARED_RESULT: ${{ needs.dev-shared.result }}
      run: test "$OUTCOME" = success && test "$SHARED_RESULT" = success
  test:
    name: Unit tests
    needs:
    - changes
    - dev-shared
    if: always() && needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require canonical command success
      env:
        OUTCOME: ${{ needs.dev-shared.outputs.test }}
        SHARED_RESULT: ${{ needs.dev-shared.result }}
      run: test "$OUTCOME" = success && test "$SHARED_RESULT" = success
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Restore pinned Cargo caches
      id: cargo-cache
      uses: ./.github/actions/cargo-cache-restore
      with:
        job: ${{ github.job }}
        profile: release
    - name: Build release workspace
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo build --workspace --release --locked
    - name: Package server artifact
      shell: bash
      run: 'set -euo pipefail

        artifact="notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}-${{
        github.sha }}"

        mkdir -p dist

        tar -C target/release -czf "dist/${artifact}.tar.gz" notion-knowledge-server

        '
    - name: Upload server artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}
        path: dist/*.tar.gz
        if-no-files-found: error
        retention-days: 7
    - name: Save successful refreshed Cargo caches
      if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
        == github.repository)
      uses: ./.github/actions/cargo-cache-save
      with:
        key: ${{ steps.cargo-cache.outputs.key }}
        hit: ${{ steps.cargo-cache.outputs.hit }}
        downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
        downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}
  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_CACHE_SCOPE: bench175-shared-v2-docker
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Test cached image identity rejection
      run: python3 scripts/test-container-smoke.py
    - name: Read canonical image identity
      id: identity
      run: "python3 - <<'PY'\nimport os, tomllib\nwith open('Cargo.toml', 'rb') as\
        \ manifest:\n    version = tomllib.load(manifest)['workspace']['package']['version']\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    print(f'version={version}',\
        \ file=output)\nPY\n"
    - name: Build and load final runtime image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: notion-knowledge:smoke
        build-args: 'VERSION=${{ steps.identity.outputs.version }}

          REVISION=${{ github.sha }}

          '
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
    - name: Load pinned builder for permission probe
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        platforms: linux/amd64
        target: probe-builder
        load: true
        tags: notion-knowledge:smoke-builder
        build-args: VERSION=${{ steps.identity.outputs.version }}
    - name: Verify final runtime image
      run: python3 scripts/benchmark-container.py --prebuilt --builder-image notion-knowledge:smoke-builder
    - name: Export verified compilation layers
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
        == github.repository
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        platforms: linux/amd64
        build-args: 'VERSION=${{ steps.identity.outputs.version }}

          REVISION=${{ github.sha }}

          '
        cache-to: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }},mode=max,timeout=10m
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#security --command true
    - name: Verify security gate failure paths
      run: nix develop .#security --command python3 scripts/test-security-scanning.py
    - name: Audit locked dependencies against fresh RustSec advisories
      run: nix develop .#security --command ./scripts/check-dependencies.sh
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout complete history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#security --command true
    - name: Scan reachable history with redacted findings
      run: nix develop .#security --command ./scripts/check-secrets.sh
  gate:
    name: CI gate
    if: always()
    needs:
    - changes
    - agent-layout
    - fmt
    - clippy
    - check
    - test
    - build
    - container
    - dependencies
    - secrets
    - dev-shared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Require every selected check to succeed
      env:
        CI_NEEDS: ${{ toJSON(needs) }}
      run: python3 scripts/ci-jobs.py gate
  dev-shared:
    needs: changes
    if: needs.changes.outputs.check == 'true' || needs.changes.outputs.clippy == 'true'
      || needs.changes.outputs.test == 'true'
    name: Shared development probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Restore pinned Cargo caches
      id: cargo-cache
      uses: ./.github/actions/cargo-cache-restore
      with:
        job: check
        profile: debug
    - name: Run cargo check
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo check --workspace --all-targets --locked
      id: check
      continue-on-error: true
      if: needs.changes.outputs.check == 'true'
    - name: Run Clippy
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo clippy --workspace --all-targets --locked -- -D warnings
      id: clippy
      continue-on-error: true
      if: needs.changes.outputs.clippy == 'true'
    - name: Run unit tests
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo test --workspace --locked
      id: test
      continue-on-error: true
      if: needs.changes.outputs.test == 'true'
    - name: Save successful refreshed Cargo caches
      if: success() && steps.check.outcome != 'failure' && steps.clippy.outcome !=
        'failure' && steps.test.outcome != 'failure' && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
      uses: ./.github/actions/cargo-cache-save
      with:
        key: ${{ steps.cargo-cache.outputs.key }}
        hit: ${{ steps.cargo-cache.outputs.hit }}
        downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
        downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}
    - name: Inject terminal shared-job failure after successful commands
      run: exit 1
    outputs:
      check: ${{ steps.check.outcome }}
      clippy: ${{ steps.clippy.outcome }}
      test: ${{ steps.test.outcome }}
