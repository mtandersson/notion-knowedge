name: CI

on:
  pull_request:
    branches:
      - main
      - benchmark/153-foundation
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: CI input selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent-layout: ${{ steps.select.outputs.agent-layout }}
      fmt: ${{ steps.select.outputs.fmt }}
      clippy: ${{ steps.select.outputs.clippy }}
      check: ${{ steps.select.outputs.check }}
      test: ${{ steps.select.outputs.test }}
      build: ${{ steps.select.outputs.build }}
      container: ${{ steps.select.outputs.container }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      secrets: ${{ steps.select.outputs.secrets }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test input selection and final gate
        run: python3 scripts/test-ci-jobs.py

      - name: Select relevant jobs
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-jobs.py select --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"

  agent-layout:
    needs: changes
    if: needs.changes.outputs.agent-layout == 'true'
    name: Agent layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify shared agent guidance and skill discovery
        run: ./scripts/check-agent-layout.sh

  fmt:
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.clippy == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore Cargo dependency cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore Cargo build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: target
          key: target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ github.job }}-

      - name: Run Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore Cargo dependency cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore Cargo build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: target
          key: target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ github.job }}-

      - name: Run cargo check
        run: nix develop --command cargo check --workspace --all-targets --locked

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore Cargo dependency cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore Cargo build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: target
          key: target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ github.job }}-

      - name: Run unit tests
        run: nix develop --command cargo test --workspace --locked

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore Cargo dependency cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore Cargo build cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: target
          key: target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ github.job }}-

      - name: Build release workspace
        run: nix develop --command cargo build --workspace --release --locked

      - name: Package server artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}"
          mkdir -p dist
          tar -C target/release -czf "dist/${artifact}.tar.gz" notion-knowledge-server

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify final runtime image
        run: python3 scripts/smoke-container.py

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify security gate failure paths
        run: nix develop --command python3 scripts/test-security-scanning.py

      - name: Audit locked dependencies against fresh RustSec advisories
        run: nix develop --command ./scripts/check-dependencies.sh

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Scan reachable history with redacted findings
        run: nix develop --command ./scripts/check-secrets.sh

  gate:
    name: CI gate
    if: always()
    needs: [changes, agent-layout, fmt, clippy, check, test, build, container, dependencies, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-jobs.py gate
