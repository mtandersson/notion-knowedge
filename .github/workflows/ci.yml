name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      native-artifact-codec:
        description: Native executable archive codec (gzip is the measurement baseline)
        type: choice
        options: [zstd, gzip]
        default: zstd

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  # CI never reuses incremental state; it only adds size to cached targets.
  CARGO_INCREMENTAL: 0
  # Keep file/line backtraces without full dependency DWARF in every job.
  # scripts/cargo-cache.py includes all three in Cargo snapshot keys.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    name: CI input selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent-layout: ${{ steps.select.outputs.agent-layout }}
      fmt: ${{ steps.select.outputs.fmt }}
      clippy: ${{ steps.select.outputs.clippy }}
      clippy-features: ${{ steps.select.outputs.clippy-features }}
      test: ${{ steps.select.outputs.test }}
      test-local-qwen: ${{ steps.select.outputs.test-local-qwen }}
      native-build: ${{ steps.select.outputs.native-build }}
      native-test: ${{ steps.select.outputs.native-test }}
      build: ${{ steps.select.outputs.build }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      secrets: ${{ steps.select.outputs.secrets }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test input selection and final gate
        run: python3 scripts/test-ci-jobs.py

      - name: Check release metadata and validation tests
        run: |
          python3 scripts/check-release.py
          python3 scripts/test-release.py

      - name: Test offline retrieval evaluation harness
        run: python3 scripts/test-retrieval-eval.py

      - name: Verify retrieval ranking metrics
        run: python3 scripts/test-retrieval-metrics.py
      - name: Lexical coverage analyzer tests
        run: python3 scripts/test-lexical-coverage.py

      - name: Validate graph boost evaluation cases and protocol
        run: python3 scripts/test-graph-boost-eval.py

      - name: Test exact identifier retrieval quality gate
        run: python3 scripts/test-exact-identifier-gate.py

      - name: Validate explicit production resource policies
        run: python3 scripts/test-production-resources.py

      - name: Validate isolated Notion read smoke contracts
        run: python3 scripts/test-smoke-notion-read.py

      - name: Validate bounded model measurement contracts
        run: python3 scripts/test-measure-model-container.py

      - name: Select relevant jobs
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-jobs.py select --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"

  agent-layout:
    needs: changes
    if: needs.changes.outputs.agent-layout == 'true'
    name: Agent layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify shared agent guidance and skill discovery
        run: ./scripts/check-agent-layout.sh

  fmt:
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop .#format --command cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.clippy == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: clippy
          profile: debug

      - name: Run Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  clippy-features:
    needs: changes
    if: needs.changes.outputs.clippy-features == 'true'
    name: Clippy (native features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: clippy-features
          profile: debug

      - name: Lint optional local Qwen provider
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-retrieval --all-targets --features local-qwen --locked -- -D warnings
      - name: Lint production webhook worker
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-server --all-targets --features webhook-worker --locked -- -D warnings
      - name: Lint production retrieval evaluation adapter
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-retrieval --example production-eval --features local-qwen,local-lancedb --locked -- -D warnings
      - name: Lint optional local LanceDB adapter
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-retrieval --all-targets --features local-lancedb --locked -- -D warnings

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: Unit tests (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: test-workspace
          profile: debug

      - name: Run workspace tests
        run: nix develop --command cargo test --workspace --locked

      - name: Report compiled test cache footprint
        run: |
          du -h --max-depth=2 target/debug
          find target/debug -type f -printf '%s %p\n' | sort -nr | sed -n '1,20p'

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  test-local-qwen:
    needs: changes
    if: needs.changes.outputs.test-local-qwen == 'true'
    name: Unit tests (local-qwen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: test-local-qwen
          profile: debug

      - name: Run local-qwen tests
        run: nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-qwen --locked

      - name: Test offline model comparison examples
        run: nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-qwen,eval-e5 --example qwen-eval --example e5-eval --locked

      - name: Report compiled test cache footprint
        run: |
          du -h --max-depth=2 target/debug
          find target/debug -type f -printf '%s %p\n' | sort -nr | sed -n '1,20p'

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  native-build:
    needs: changes
    if: needs.changes.outputs.native-build == 'true'
    name: Compile native test executables
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATIVE_ARTIFACT_CODEC: ${{ inputs['native-artifact-codec'] || 'zstd' }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Test native executable artifact delivery
        run: nix develop .#test-runtime --command python3 scripts/test-native-test-artifacts.py
      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: test-native-build
          profile: debug
      # Compile the shipping native feature set once. The production evaluation
      # example links on main only; Clippy (native features) checks it on PRs.
      - name: Compile native tests once
        env:
          NATIVE_EXAMPLES: ${{ github.event_name != 'pull_request' && '--example production-eval' || '' }}
        run: |
          nix develop .#spike --command cargo test -p notion-knowledge-server -p notion-knowledge-retrieval --features notion-knowledge-server/webhook-worker --lib --tests $NATIVE_EXAMPLES --no-run --message-format=json-render-diagnostics --locked > native-tests.jsonl
          nix develop .#spike --command cargo metadata --no-deps --locked --offline --format-version 1 > native-metadata.json
      - name: Package executable artifacts
        run: nix develop .#test-runtime --command python3 scripts/native-test-artifacts.py pack --messages native-tests.jsonl --metadata native-metadata.json --revision "$GITHUB_SHA" --output dist/native-tests --codec "$NATIVE_ARTIFACT_CODEC"
      - name: Preserve native documentation tests
        run: nix develop .#spike --command cargo test -p notion-knowledge-server -p notion-knowledge-retrieval --features notion-knowledge-server/webhook-worker --doc --locked
      - name: Verify persisted compression compatibility in both directions
        run: nix develop .#spike --command python3 scripts/test-compression-compat.py
      - name: Upload retrieval test executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-local-lancedb-${{ github.sha }}
          path: dist/native-tests/local-lancedb.tar.*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Upload server test executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-webhook-worker-${{ github.sha }}
          path: dist/native-tests/webhook-worker.tar.*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Record executable footprint
        run: cat dist/native-tests/footprint.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  native-test:
    needs: [changes, native-build]
    if: needs.changes.outputs.native-test == 'true'
    name: Unit tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: local-lancedb
          - suite: webhook-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix runtime
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Download this suite's executable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests-${{ matrix.suite }}-${{ github.sha }}
          path: dist/native-tests
      - name: Run native test executables without compilation
        env:
          NATIVE_SUITE: ${{ matrix.suite }}
        run: nix develop .#test-runtime --command python3 scripts/native-test-artifacts.py run --archive dist/native-tests/"$NATIVE_SUITE".tar.* --revision "$GITHUB_SHA" --suite "$NATIVE_SUITE" --report "dist/native-tests/results-$NATIVE_SUITE.json"
      - name: Upload execution timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-results-${{ matrix.suite }}-${{ github.sha }}
          path: dist/native-tests/results-*.json
          if-no-files-found: warn
          retention-days: 3

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: build
          profile: release

      - name: Build release workspace
        run: nix develop --command cargo build --workspace --release --locked

      - name: Package server artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}"
          mkdir -p dist
          tar -C target/release -czf "dist/${artifact}.tar.gz" notion-knowledge-server

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify security gate failure paths
        run: nix develop .#security --command python3 scripts/test-security-scanning.py

      - name: Audit locked dependencies against fresh RustSec advisories
        run: nix develop .#security --command ./scripts/check-dependencies.sh

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Scan reachable history with redacted findings
        run: nix develop .#security --command ./scripts/check-secrets.sh

  gate:
    name: CI gate
    if: always()
    # Required checks only. Optional jobs (Clippy native features, local-qwen
    # and native tests, release build) still run and report; see docs/ci.md.
    needs: [changes, agent-layout, fmt, clippy, test, dependencies, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-jobs.py gate
