name: CI
'on':
  pull_request:
    branches:
    - main
    - bench174-baseline
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  BENCH_CACHE_NAMESPACE: nk174-b-20261002
jobs:
  agent-layout:
    name: Agent layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify shared agent guidance and skill discovery
      run: ./scripts/check-agent-layout.sh
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Check formatting
      run: nix develop --command cargo fmt --all -- --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Restore Cargo dependency cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: '~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db

          '
        key: nk174-b-20261002-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: nk174-b-20261002-cargo-${{ runner.os }}-
    - name: Restore Cargo build cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: target
        key: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock',
          'flake.lock') }}
        restore-keys: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-
    - name: Run Clippy
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo clippy --workspace --all-targets --locked -- -D warnings
  check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Restore Cargo dependency cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: '~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db

          '
        key: nk174-b-20261002-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: nk174-b-20261002-cargo-${{ runner.os }}-
    - name: Restore Cargo build cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: target
        key: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock',
          'flake.lock') }}
        restore-keys: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-
    - name: Run cargo check
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo check --workspace --all-targets --locked
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Restore Cargo dependency cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: '~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db

          '
        key: nk174-b-20261002-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: nk174-b-20261002-cargo-${{ runner.os }}-
    - name: Restore Cargo build cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: target
        key: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock',
          'flake.lock') }}
        restore-keys: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-
    - name: Run unit tests
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo test --workspace --locked
  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Restore Cargo dependency cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: '~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db

          '
        key: nk174-b-20261002-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: nk174-b-20261002-cargo-${{ runner.os }}-
    - name: Restore Cargo build cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: target
        key: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock',
          'flake.lock') }}
        restore-keys: nk174-b-20261002-target-${{ runner.os }}-${{ github.job }}-
    - name: Build release workspace
      run: nix develop --command env CARGO_LOG=cargo::core::compiler::fingerprint=info
        cargo build --workspace --release --locked
    - name: Package server artifact
      shell: bash
      run: 'set -euo pipefail

        artifact="notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}-${{
        github.sha }}"

        mkdir -p dist

        tar -C target/release -czf "dist/${artifact}.tar.gz" notion-knowledge-server

        '
    - name: Upload server artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}
        path: dist/*.tar.gz
        if-no-files-found: error
        retention-days: 7
  container:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Build and verify final runtime image
      run: python3 scripts/benchmark-container.py
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Verify security gate failure paths
      run: nix develop --command python3 scripts/test-security-scanning.py
    - name: Audit locked dependencies against fresh RustSec advisories
      run: nix develop --command ./scripts/check-dependencies.sh
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout complete history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: 'experimental-features = nix-command flakes

          '
    - name: Materialize pinned Nix shell
      run: nix develop .#default --command true
    - name: Scan reachable history with redacted findings
      run: nix develop --command ./scripts/check-secrets.sh
