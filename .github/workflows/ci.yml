name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  changes:
    name: CI input selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent-layout: ${{ steps.select.outputs.agent-layout }}
      fmt: ${{ steps.select.outputs.fmt }}
      clippy: ${{ steps.select.outputs.clippy }}
      check: ${{ steps.select.outputs.check }}
      test: ${{ steps.select.outputs.test }}
      build: ${{ steps.select.outputs.build }}
      container: ${{ steps.select.outputs.container }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      secrets: ${{ steps.select.outputs.secrets }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test input selection and final gate
        run: python3 scripts/test-ci-jobs.py

      - name: Check release metadata and validation tests
        run: |
          python3 scripts/check-release.py
          python3 scripts/test-release.py

      - name: Test offline retrieval evaluation harness
        run: python3 scripts/test-retrieval-eval.py

      - name: Verify retrieval ranking metrics
        run: python3 scripts/test-retrieval-metrics.py
      - name: Lexical coverage analyzer tests
        run: python3 scripts/test-lexical-coverage.py

      - name: Validate graph boost evaluation cases and protocol
        run: python3 scripts/test-graph-boost-eval.py

      - name: Test exact identifier retrieval quality gate
        run: python3 scripts/test-exact-identifier-gate.py

      - name: Validate explicit production resource policies
        run: python3 scripts/test-production-resources.py

      - name: Select relevant jobs
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-jobs.py select --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"

  agent-layout:
    needs: changes
    if: needs.changes.outputs.agent-layout == 'true'
    name: Agent layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify shared agent guidance and skill discovery
        run: ./scripts/check-agent-layout.sh

  fmt:
    needs: changes
    if: needs.changes.outputs.fmt == 'true'
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop .#format --command cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.clippy == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: ${{ github.job }}
          profile: debug

      - name: Run Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint optional local Qwen provider
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-retrieval --all-targets --features local-qwen --locked -- -D warnings
      - name: Lint production webhook worker
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-server --all-targets --features webhook-worker --locked -- -D warnings
      - name: Lint production retrieval evaluation adapter
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-retrieval --example production-eval --features local-qwen,local-lancedb --locked -- -D warnings
      - name: Lint optional local LanceDB adapter
        run: nix develop .#spike --command cargo clippy -p notion-knowledge-retrieval --all-targets --features local-lancedb --locked -- -D warnings


      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: ${{ github.job }}
          profile: debug

      - name: Run cargo check
        run: nix develop --command cargo check --workspace --all-targets --locked

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: Unit tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workspace
            shell: default
            args: --workspace
          - suite: local-qwen
            shell: spike
            args: -p notion-knowledge-retrieval --features local-qwen
          - suite: webhook-worker
            shell: spike
            args: -p notion-knowledge-server --features webhook-worker
          - suite: local-lancedb
            shell: spike
            args: -p notion-knowledge-retrieval --features local-lancedb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Retain file/line backtraces without full dependency type/variable DWARF.
      # This setting is included in Cargo snapshot compatibility keys.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: test-${{ matrix.suite }}
          profile: debug

      - name: Run ${{ matrix.suite }} tests
        run: nix develop .#${{ matrix.shell }} --command cargo test ${{ matrix.args }} --locked

      - name: Test offline model comparison examples
        if: matrix.suite == 'local-qwen'
        run: nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-qwen,eval-e5 --example qwen-eval --example e5-eval --locked

      - name: Test offline lexical operators
        if: matrix.suite == 'local-lancedb'
        run: |
          nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --example lexical-candidate --locked
          CARGO_PROFILE_DEV_DEBUG="$CARGO_PROFILE_TEST_DEBUG" nix develop .#spike --command cargo build -p notion-knowledge-retrieval --features local-lancedb --example lexical-candidate --example lexical-runtime --example lexical-verify --locked
          NK_LEXICAL_OPERATOR="$GITHUB_WORKSPACE/target/debug/examples/lexical-candidate" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib prepared_abort_operator_retries_real_crash_states --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib pinned_normal_runtime_reopens_legacy_native_probe --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib verified_prior_runtime_legacy_uses_actual_owned_source_without_sql_changes --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" NK_LEXICAL_VERIFY="$GITHUB_WORKSPACE/target/debug/examples/lexical-verify" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib offline_verification_command_legacy_retries_killed_publication --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib pinned_runtime_builds_and_reopens_legacy_candidate_from_bound_current_rows --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib owned_legacy_archive_reuse_then_latest_acknowledged_rows_rebuild --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib prepared_legacy_pair_preserves_exact_archive_and_newer_acknowledged_source --locked -- --ignored

          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib runtime_journal_legacy_handoff_quarantine_and_retention_preserve_source --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib runtime_publication_recovers_legacy_after_killed_processes --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib runtime_publication_rejects_physical_replacement_and_stale_preparation --locked -- --ignored
          NK_LEXICAL_RUNTIME="$GITHUB_WORKSPACE/target/debug/examples/lexical-runtime" nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-lancedb --lib quarantined_runtime_source_capture_legacy_preserves_latest_source --locked -- --ignored

      - name: Test production evaluation storage and authorization boundaries
        if: matrix.suite == 'webhook-worker'
        run: nix develop .#spike --command cargo test -p notion-knowledge-retrieval --features local-qwen,local-lancedb --example production-eval --locked

      - name: Report compiled test cache footprint
        run: |
          du -h --max-depth=2 target/debug
          find target/debug -type f -printf '%s %p\n' | sort -nr | sed -n '1,20p'

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore pinned Cargo caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          job: ${{ github.job }}
          profile: release

      - name: Build release workspace
        run: nix develop --command cargo build --workspace --release --locked

      - name: Package server artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}"
          mkdir -p dist
          tar -C target/release -czf "dist/${artifact}.tar.gz" notion-knowledge-server

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notion-knowledge-server-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      # Only protected main can seed a missing pinned Cargo snapshot. PRs
      # restore compatible main snapshots; neither PRs nor source-only main
      # edits publish new multi-GB targets that can evict Docker roots.
      - name: Save successful refreshed Cargo caches
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.key }}
          hit: ${{ steps.cargo-cache.outputs.hit }}
          matched-key: ${{ steps.cargo-cache.outputs.matched-key }}
          prefix: ${{ steps.cargo-cache.outputs.prefix }}
          downloads-key: ${{ steps.cargo-cache.outputs.downloads-key }}
          downloads-hit: ${{ steps.cargo-cache.outputs.downloads-hit }}

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true' && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps: &container_smoke_steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Verified BuildKit v0.33.1 and its GHA index protocol.
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GHCR with job-scoped package permissions
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test cached image identity rejection
        run: python3 scripts/test-container-smoke.py

      - name: Verify actual Docker context excludes runtime and private data
        run: python3 scripts/test-container-context.py

      - name: Read canonical image identity
        id: identity
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY

      - name: Build and load final runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: notion-knowledge:smoke
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-main-amd64

      - name: Load pinned builder for permission probe
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: probe-builder
          load: true
          tags: notion-knowledge:smoke-builder
          build-args: VERSION=${{ steps.identity.outputs.version }}

      - name: Verify final runtime image
        run: python3 scripts/smoke-container.py --prebuilt --builder-image notion-knowledge:smoke-builder

      - name: Verify production indexing and offline retrieval in final image
        run: python3 scripts/smoke-retrieval-container.py --prebuilt --assets "$RUNNER_TEMP/nk-qwen-assets" --download-assets

      - name: Smoke test local Docker Compose stack
        run: |
          docker tag notion-knowledge:smoke notion-knowledge:local
          python3 scripts/smoke-compose.py --prebuilt

      # Keep an independent, pinned compiler cache manifest in GHCR: previous
      # hosted evidence showed that lazy final-image exports can lose builder
      # results. PR jobs have packages:read and cannot publish cache tags.
      - name: Export verified builder root
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: builder
          build-args: VERSION=${{ steps.identity.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-main-amd64-builder
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-main-amd64-builder,mode=max,oci-mediatypes=true,image-manifest=true,ignore-error=true

      # Only trusted main exports after production, retrieval and Compose smoke.
      # PR jobs lack packages:write and cannot overwrite these shared tags.
      - name: Export verified final image graph
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-main-amd64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-main-amd64,mode=max,oci-mediatypes=true,image-manifest=true,ignore-error=true

      # Only optional registry cache publication is best effort. Mandatory
      # build/load, retrieval, permission and Compose checks must still pass.
      - name: Report optional cache publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          {
            echo '### Optional GHCR BuildKit cache publication'
            echo 'The verified builder and final-image GHCR registry cache exports were attempted.'
            echo 'BuildKit may ignore registry upload failures (`ignore-error=true`); check both export logs for pushed manifests or warnings.'
            echo 'A successful CI gate validates the image and smoke tests, **not** GHCR cache publication.'
          } >> "$GITHUB_STEP_SUMMARY"

  container-main:
    needs: changes
    if: needs.changes.outputs.container == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Container smoke (main cache publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps: *container_smoke_steps

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify security gate failure paths
        run: nix develop .#security --command python3 scripts/test-security-scanning.py

      - name: Audit locked dependencies against fresh RustSec advisories
        run: nix develop .#security --command ./scripts/check-dependencies.sh

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Scan reachable history with redacted findings
        run: nix develop .#security --command ./scripts/check-secrets.sh

  gate:
    name: CI gate
    if: always()
    needs: [changes, agent-layout, fmt, clippy, check, test, build, container, container-main, dependencies, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-jobs.py gate
