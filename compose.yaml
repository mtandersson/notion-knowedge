# Local-only development stack. Use scripts/compose-dev.sh to derive the image
# version from Cargo.toml; Dockerfile intentionally rejects a mismatched VERSION.
services:
  notion-knowledge:
    image: notion-knowledge:local
    build:
      context: .
      args:
        VERSION: ${NK_COMPOSE_VERSION:?Run scripts/compose-dev.sh to derive Cargo version}
    command: ["--http"]
    environment:
      NK_HTTP_HOST: "0.0.0.0"
      NK_HTTP_PORT: "3000"
      NK_NOTION_AUTH: ${NK_NOTION_AUTH:-none}
      # Only set a real token in a gitignored .env file or exported environment.
      NOTION_TOKEN: ${NOTION_TOKEN:-}
    ports:
      - "127.0.0.1:${NK_COMPOSE_PORT:-3000}:3000"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - index:/var/lib/notion-knowledge/index
      - state:/var/lib/notion-knowledge/state
      - models:/var/lib/notion-knowledge/models
    healthcheck:
      # Liveness, not readiness: the index is intentionally unconfigured today.
      test: ["CMD", "/usr/local/bin/notion-knowledge-server", "--healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_signal: SIGINT

volumes:
  index:
  state:
  models:
