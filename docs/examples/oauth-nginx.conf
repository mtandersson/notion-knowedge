# Include inside nginx's http {} context on a dedicated HTTPS listener.
# Replace the public hostname and certificate paths together. The backend
# listens only on 127.0.0.1:3000 and must not be publicly reachable.
map $http_origin $knowledge_backend_origin {
    default                       "deny";
    ""                            "";
    "https://knowledge.example.com" "http://127.0.0.1:3000";
    "https://chatgpt.com"           "http://127.0.0.1:3000";
}

server {
    listen 443 ssl default_server;
    server_name knowledge.example.com;
    ssl_certificate /etc/letsencrypt/live/knowledge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Callback queries contain codes/state. Disable both request-log paths.
    access_log off;
    error_log /dev/null crit;

    # Validate public authority BEFORE adapting headers for backend guards.
    if ($http_host = "") { return 421; }
    if ($host != knowledge.example.com) { return 421; }
    if ($knowledge_backend_origin = "deny") { return 403; }

    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;

    # Health, metrics, webhook and operator routes stay private.
    location ~ ^/(mcp|authorize|token|revoke|oauth/notion/callback|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource(/mcp)?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:3000";
        proxy_set_header Origin $knowledge_backend_origin;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        # Other request headers, including Cookie and MCP protocol/session
        # headers, retain nginx's default forwarding behavior.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    location / { return 404; }
}
