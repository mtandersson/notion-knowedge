[package]
name = "notion-knowledge-notion"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# Only for credential-free integration testing; never enabled in production.
test-fixtures = []

[dependencies]
notion-knowledge-core = { path = "../core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.41"
sha2 = "0.10"
tokio = { workspace = true, features = ["sync", "time", "net", "fs", "io-util"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
notion-knowledge-retrieval = { path = "../retrieval" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
