[package]
name = "notion-knowledge-mcp"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
notion-knowledge-core = { path = "../core" }
rmcp.workspace = true
http = "1"
tokio = { workspace = true, features = ["sync"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
notion-knowledge-retrieval = { path = "../retrieval" }
notion-knowledge-notion = { path = "../notion", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["io-util"] }
