[package]
name = "qwen-lance-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
notion-knowledge-mcp = { path = "../../../mcp" }
notion-knowledge-server = { path = "../../../server" }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
notion-knowledge-notion = { path = "../../../notion" }
notion-knowledge-core = { path = "../../../core" }
anyhow = "1"
arrow-array = "58.4"
arrow-schema = "58.4"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
fastembed = { version = "=7.1.0", default-features = false, features = ["qwen3", "ort-load-dynamic"] }
futures = "0.3"
# 0.39.0 references Error::Http even in embedded-only builds. Runtime is local.
lancedb = { version = "=0.39.0", features = ["remote"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0
[profile.release]
debug = 0
