[package]
name = "notion-knowledge-server"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
default = []
webhook-worker = ["notion-knowledge-retrieval/local-lancedb", "notion-knowledge-retrieval/local-qwen"]

[dependencies]
notion-knowledge-core = { path = "../core" }
notion-knowledge-mcp = { path = "../mcp" }
notion-knowledge-notion = { path = "../notion" }
notion-knowledge-retrieval = { path = "../retrieval" }
rmcp = { workspace = true, features = ["transport-io", "transport-streamable-http-server"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"
http-body = "1"

serde = { version = "1", features = ["derive"] }
hmac = "0.12"
tempfile = "3"
sha2 = "0.10"
ring = "0.17"
rustix = { version = "1", features = ["process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
notion-knowledge-retrieval = { path = "../retrieval", features = ["test-fixtures"] }
notion-knowledge-notion = { path = "../notion", features = ["test-fixtures"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tokio = { workspace = true, features = ["process", "io-util", "time"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
